[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pypengim"
version = "0.2.0"
description = "Teochew (Chaoshan) text processing: hanzi-to-pinyin, polyphone disambiguation, accent conversion, romanization scheme conversion, Teochew pinyin to IPA"
readme = "README.en.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
dependencies = ["jieba", "cn2an", "pyyaml"]

[tool.setuptools]
packages = ["pypengim"]

[tool.setuptools.package-data]
pypengim = ["data/**/*.txt", "data/**/*.yaml", "data/**/*.md"]
